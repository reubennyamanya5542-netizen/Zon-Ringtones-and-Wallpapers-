// Signs every build with your own fixed key so each new APK installs over the old one.
// The key comes from GitHub Secrets (see build-apk.yml); nothing secret is stored in this file.
allprojects {
  plugins.withId('com.android.application') {
    afterEvaluate {
      def path = System.getenv('ZON_KEYSTORE'), pass = System.getenv('ZON_KS_PASS')
      if (!path || !pass || !new File(path).exists()) { println 'zon: signing key not found, build keeps its own signing'; return }
      android {
        signingConfigs {
          zon { storeFile new File(path); storePassword pass; keyAlias 'zon'; keyPassword pass }
        }
        buildTypes {
          debug { signingConfig signingConfigs.zon }
          release { signingConfig signingConfigs.zon }
        }
        def run = System.getenv('GITHUB_RUN_NUMBER')
        if (run) defaultConfig.versionCode = run.toInteger()
      }
    }
  }
}
