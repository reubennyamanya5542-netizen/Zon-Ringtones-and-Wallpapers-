name: Build APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'native/**', 'package.json', 'capacitor.config.json', 'debug.keystore', '.github/workflows/build-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Web files
        run: |
          mkdir -p www && cp index.html www/
          sed -i "s#const CATALOG_URL='catalog.json'#const CATALOG_URL='https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/catalog.json'#" www/index.html
          grep -q raw.githubusercontent www/index.html
      - name: Create Android project
        run: |
          npx cap add android
          D=android/app/src/main/java/com/zon/app
          rm -f $D/MainActivity.java
          cp native/*.java $D/
          python3 native/patch_manifest.py
          sed -i 's/minSdkVersion = .*/minSdkVersion = 29/' android/variables.gradle
          npx cap sync android
      - name: App icon
        run: |
          pip install pillow
          python3 native/make_icons.py android/app/src/main/res
      - name: Use the same signing key every build
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "Signing with the key from the DEBUG_KEYSTORE_B64 secret"
          elif [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; echo "Signing with debug.keystore from the repo"
          else echo "::warning::No signing key found. This build gets a random key and will not install over an older Zon. Add the DEBUG_KEYSTORE_B64 secret."; fi
      - name: Raise the version number every build
        run: sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zon-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
