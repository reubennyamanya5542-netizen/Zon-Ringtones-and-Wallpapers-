name: Build APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'icon.png', 'native/**', 'package.json', 'capacitor.config.json', '.github/workflows/build-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Web files
        run: |
          mkdir -p www && cp index.html www/
          sed -i "s#const CATALOG_URL='catalog.json'#const CATALOG_URL='https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/catalog.json'#" www/index.html
          grep -q raw.githubusercontent www/index.html
      - name: Create Android project
        run: |
          npx cap add android
          D=android/app/src/main/java/com/zon/app
          rm -f $D/MainActivity.java
          cp native/*.java $D/
          python3 native/patch_manifest.py
          sed -i 's/minSdkVersion = .*/minSdkVersion = 29/' android/variables.gradle
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          r = 'android/app/src/main/res'
          shutil.rmtree(r + '/mipmap-anydpi-v26', ignore_errors=True)
          im = Image.open('icon.png').convert('RGBA')
          for d, z in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              p = f'{r}/mipmap-{d}'; os.makedirs(p, exist_ok=True)
              for n in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  im.resize((z, z), Image.LANCZOS).save(f'{p}/{n}.png')
          PY
          npx cap sync android
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
