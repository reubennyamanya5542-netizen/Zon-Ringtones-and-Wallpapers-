name: Build APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'native/**', 'package.json', 'capacitor.config.json', 'debug.keystore', '.github/workflows/build-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Web files
        run: |
          mkdir -p www && cp index.html www/
          sed -i "s#const CATALOG_URL='catalog.json'#const CATALOG_URL='https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/catalog.json'#" www/index.html
          grep -q raw.githubusercontent www/index.html
      - name: Create Android project
        run: |
          npx cap add android
          D=android/app/src/main/java/com/zon/app
          rm -f $D/MainActivity.java
          cp native/*.java $D/
          python3 native/patch_manifest.py
          sed -i 's/minSdkVersion = .*/minSdkVersion = 29/' android/variables.gradle
          npx cap sync android
      - name: App icon
        run: |
          pip install pillow
          python3 native/make_icons.py android/app/src/main/res
      - name: Use the same signing key every build
        run: |
          if [ -f debug.keystore ]; then mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore; else echo "No debug.keystore in the repo, so this build gets a random key"; fi
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
