name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['audio/**', 'wallpapers/**', 'thumbs/**', 'catalog.json']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Find the Android project
        id: find
        run: |
          d=$(dirname "$(find . -maxdepth 3 -name gradlew -not -path './node_modules/*' | head -1)")
          echo "dir=$d" >> "$GITHUB_OUTPUT"; echo "Android project: $d"
      - name: Copy web files (if this is a Capacitor project)
        run: |
          if [ -f capacitor.config.json ] || [ -f capacitor.config.ts ]; then
            npm ci || npm install
            npx cap sync android
          fi
      - name: Restore signing key from secrets
        env:
          KS: ${{ secrets.ZON_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the secrets ZON_KEYSTORE_B64 and ZON_KS_PASS (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/zon.keystore"
      - name: Build signed APK
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          ZON_KEYSTORE: ${{ runner.temp }}/zon.keystore
          ZON_KS_PASS: ${{ secrets.ZON_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -I "$GITHUB_WORKSPACE/signing/sign.init.gradle" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zon-apk-${{ github.run_number }}
          path: '**/build/outputs/apk/debug/*.apk'
